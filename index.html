<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        <div class="game-container">
            <div class="game-grid" id="game-grid"></div>
        </div>
    </div>
    <div class="scores-container">
        <div class="score-box">
            <div class="score-title">Счет</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
            <div class="score-title">Лучший</div>
            <div class="score-value" id="best-score">0</div>
        </div>
    </div>
    <div class="controls">
        <button id="new-game">Новая игра</button>
    </div>
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2>Игра окончена!</h2>
            <p>Ваш счет: <span id="final-score">0</span></p>
            <p>Введите ваше имя:</p>
            <input type="text" id="player-name" placeholder="Ваше имя">
            <div class="modal-buttons">
                <button id="save-score">Сохранить результат</button>
                <button id="restart-game">Начать заново</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="leaderboard-modal">
        <div class="modal-content">
            <h2>Таблица лидеров</h2>
            <div class="leaderboard">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Счет</th>
                            <th>Дата</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button id="close-leaderboard">Закрыть</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
